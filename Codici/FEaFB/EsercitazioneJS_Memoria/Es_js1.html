
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio 1 - Variabili locali</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background-color: #f2f2f2;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Esercizio 1 - Variabili locali</h2>

    <button onclick="esegui()">Calcola</button>

    <p id="risultato"></p>

    <script>
        function calcolaTotale(a, b) {
            let somma = a + b;
            return somma;
        }

        function esegui() {
            let risultato1 = calcolaTotale(10, 20);
            let risultato2 = calcolaTotale(5, 15);
            let risultato3 = calcolaTotale(30, 40);

            document.getElementById("risultato").innerHTML =
                risultato1 + "<br>" +
                risultato2 + "<br>" +
                risultato3;

            // La variabile somma esiste solo
            // all'interno di calcolaTotale()

            // console.log(somma); // ReferenceError
        }
    </script>

</body>
</html>
